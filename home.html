<body onclick="closePopup()">
  <div id="popup" style="background: #eee; padding: 20px;">
    <p>This is a popup!</p>
    <!-- Clicking this button will NOT close the popup because of stopPropagation -->
    <button onclick="keepPopupOpen(event)">Click Me</button>
  </div>

  <script>
    function closePopup() {
      console.log("Popup hidden (body clicked)");
      document.getElementById('popup').style.display = 'none';
    }

    function keepPopupOpen(event) {
      // Prevents the click event from bubbling up to <body>
      event.stopPropagation(); 
      console.log("Button clicked inside popup!");
    }
  </script>
</body>

</html>
